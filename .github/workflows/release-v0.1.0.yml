name: Publish DiskPeek v0.1.0

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.1.0.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-v0.1.0
  cancel-in-progress: false

jobs:
  release:
    name: Publish the verified v0.1.0 packages
    if: github.repository == 'GoByeBye/DiskPeek' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_REPO: GoByeBye/DiskPeek
      TARGET_COMMIT: d1306b937be30e5403125bb770a2160d1a281db4
      CI_RUN: '41752087628'
      PACKAGE_ARTIFACT: '13286286547'
      RELEASE_TAG: v0.1.0
    steps:
      # No source checkout or repository scripts execute with the release token.
      - name: Verify the successful source build and its artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$CI_RUN" |
            jq -e --arg sha "$TARGET_COMMIT" --arg repo "$GH_REPO" --argjson run "$CI_RUN" '
              .id == $run and .head_sha == $sha and .head_branch == "main" and
              .event == "push" and .name == "Build and release" and
              .status == "completed" and .conclusion == "success" and
              .repository.full_name == $repo and .head_repository.full_name == $repo
            ' >/dev/null
          gh api "repos/$GH_REPO/actions/artifacts/$PACKAGE_ARTIFACT" |
            jq -e --arg sha "$TARGET_COMMIT" --argjson run "$CI_RUN" --argjson artifact "$PACKAGE_ARTIFACT" '
              .id == $artifact and .expired == false and .size_in_bytes > 0 and
              .workflow_run.id == $run and .workflow_run.head_sha == $sha and
              (.name | startswith("DiskPeek-0.1.0-win-x64-"))
            ' >/dev/null

      - name: Download the exact verified CI artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          repository: GoByeBye/DiskPeek
          run-id: '41752087628'
          artifact-ids: '13286286547'
          path: release
          merge-multiple: true
          digest-mismatch: error

      - name: Verify exact package names and SHA-256 checksums
        shell: bash
        working-directory: release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import pathlib
          import re
          import zipfile

          packages = {"DiskPeek-0.1.0-win-x64.zip", "DiskPeek-0.1.0-source.zip"}
          files = list(pathlib.Path(".").iterdir())
          if {p.name for p in files} != packages | {"SHA256SUMS.txt"}:
              raise SystemExit("Missing or unexpected files in the release artifact")
          if any(p.is_symlink() or not p.is_file() or p.stat().st_size == 0 for p in files):
              raise SystemExit("Release assets must be nonempty regular files")
          hashes = {}
          for line in pathlib.Path("SHA256SUMS.txt").read_text(encoding="utf-8-sig").splitlines():
              if not line.strip():
                  continue
              match = re.fullmatch(r"([a-fA-F0-9]{64})[ \t]+\*?(DiskPeek-0\.1\.0-(?:win-x64|source)\.zip)", line)
              if not match or match[2] in hashes:
                  raise SystemExit("Invalid, duplicate, or unsafe checksum entry")
              hashes[match[2]] = match[1].lower()
          if set(hashes) != packages:
              raise SystemExit("Checksums must cover exactly the portable and source ZIPs")
          for name in sorted(packages):
              with open(name, "rb") as stream:
                  actual = hashlib.file_digest(stream, "sha256").hexdigest()
              if actual != hashes[name]:
                  raise SystemExit("SHA-256 mismatch: " + name)
              with zipfile.ZipFile(name) as archive:
                  for entry in archive.namelist():
                      normalized = entry.replace("\\", "/")
                      path = pathlib.PurePosixPath(normalized)
                      if path.is_absolute() or ".." in path.parts or re.match(r"^[A-Za-z]:", normalized):
                          raise SystemExit("Unsafe path inside ZIP: " + name)
              print("Verified " + name)
          PY

      - name: Create the exact tag and publish the release
        shell: bash
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Distinguish an absent object from authentication or API failures.
          release_json=''
          if release_json=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG"); then
            if [ "$(jq -r '.draft' <<<"$release_json")" != 'true' ]; then
              echo 'This release is already published; no tags or assets were changed.' >&2
              exit 1
            fi
          elif [ "$(jq -r '.status // empty' <<<"$release_json")" != '404' ]; then
            echo 'Could not verify whether the release already exists.' >&2
            exit 1
          fi

          tag_json=''
          if tag_json=$(gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG"); then
            object_type=$(jq -r '.object.type' <<<"$tag_json")
            object_sha=$(jq -r '.object.sha' <<<"$tag_json")
            for attempt in 1 2 3 4 5; do
              if [ "$object_type" = 'commit' ]; then break; fi
              test "$object_type" = 'tag'
              tag_json=$(gh api "repos/$GH_REPO/git/tags/$object_sha")
              object_type=$(jq -r '.object.type' <<<"$tag_json")
              object_sha=$(jq -r '.object.sha' <<<"$tag_json")
            done
            test "$object_type" = 'commit'
            if [ "$object_sha" != "$TARGET_COMMIT" ]; then
              echo 'Existing release tag points to a different commit; refusing to change it.' >&2
              exit 1
            fi
          elif [ "$(jq -r '.status // empty' <<<"$tag_json")" = '404' ]; then
            gh api --method POST "repos/$GH_REPO/git/refs" \
              --raw-field "ref=refs/tags/$RELEASE_TAG" --raw-field "sha=$TARGET_COMMIT" >/dev/null
          else
            echo 'Could not verify whether the release tag already exists.' >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/diskpeek-v0.1.0-notes.md"
          cat >"$notes" <<'NOTES'
          DiskPeek is an independent Windows x64 disk-usage analyzer, licensed under AGPL-3.0-or-later.

          - Fast NTFS metadata scanning, folder tree, largest files, file-type statistics, search, and CSV export.
          - Interactive treemap with folder-group hover highlighting, linked tree highlighting, and double-click folder zoom.
          - Portable self-contained build: no .NET installation required.

          Download `DiskPeek-0.1.0-win-x64.zip`, extract the complete folder, and run `DiskPeek.exe`. Keep `DiskPeek.Worker.exe` and the packaged files together. Fast scans of supported local NTFS drive roots request administrator access; folders and other targets use directory scanning.

          Corresponding source is in `DiskPeek-0.1.0-source.zip`. Verify either download against `SHA256SUMS.txt`. Both ZIPs come from the successful CI build of commit `d1306b937be30e5403125bb770a2160d1a281db4`.
          NOTES
          if [ -z "$release_json" ] || [ "$(jq -r '.draft // false' <<<"$release_json")" != 'true' ]; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title 'DiskPeek 0.1.0' --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" DiskPeek-0.1.0-win-x64.zip DiskPeek-0.1.0-source.zip SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --title 'DiskPeek 0.1.0' --notes-file "$notes" \
            --draft=false --prerelease=false --latest
          gh release view "$RELEASE_TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
