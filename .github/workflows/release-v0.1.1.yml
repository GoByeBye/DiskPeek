name: Request DiskPeek v0.1.1 through the release pipeline

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.1.1.yml]

permissions: {}

concurrency:
  group: request-release-v0.1.1
  cancel-in-progress: false

jobs:
  request:
    if: github.repository == 'GoByeBye/DiskPeek' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: GoByeBye/DiskPeek
    steps:
      # Only dispatch the standard pipeline; tag creation, tests, and publishing
      # remain in build.yml. No source checkout or repository code is executed.
      - name: Resume v0.1.1 using its original tagged source
        shell: bash
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$GITHUB_SHA"
          gh api "repos/$GH_REPO/contents/Directory.Build.props?ref=$GITHUB_SHA" > properties.json
          python3 - <<'PY'
          import base64
          import json
          import xml.etree.ElementTree as ET

          with open("properties.json", encoding="utf-8") as stream:
              document = json.load(stream)
          version = ET.fromstring(base64.b64decode(document["content"])).findtext("PropertyGroup/Version")
          if version != "0.1.1":
              raise SystemExit("This request only publishes version 0.1.1")
          PY
          # Keep the unpublished v0.1.1 tag fixed while retrying with the repaired
          # workflow. The standard pipeline verifies and builds this exact source.
          jq -n --arg sha "77a7e44029184606a53c80fb7a14d0116ebf09a0" \
            '{ref:"main", inputs:{release_tag:"v0.1.1", release_commit:$sha}}' |
            gh api --method POST "repos/$GH_REPO/actions/workflows/build.yml/dispatches" --input -
          echo 'Requested v0.1.1 through Build and release; that pipeline performs all validation and publishing.' >> "$GITHUB_STEP_SUMMARY"
